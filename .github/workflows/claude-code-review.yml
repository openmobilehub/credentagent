name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time: a new push cancels the run still reviewing the old head. Nothing
# is lost — a cancelled run never counts as reviewed, so the next run's scope still covers it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # OPT-IN — off by default. The CLAUDE_CODE_OAUTH_TOKEN secret exists, but the
    # account cannot use it, so the action errored on EVERY PR; as a required status
    # check that blocked all merges. Gating the job means it is *skipped* rather than
    # failed, and a skipped job counts as passing for a required check — no fake green.
    # Turn the review back on with:  gh variable set ENABLE_CLAUDE_REVIEW --body true
    # (Draft PRs are also skipped to save cost — mark ready-for-review to trigger a run.)
    if: ${{ !github.event.pull_request.draft && vars.ENABLE_CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # "Pick review scope" looks up this workflow's earlier runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: the review diffs against the base branch and, for a
          # release PR, against the previous tag (what actually ships to npm).
          fetch-depth: 0

      # A PR must not weaken its own required review: fail if this workflow file
      # differs from main (an intentional change needs an admin merge — CLAUDE.md).
      # This guards against accidental or unnoticed edits; a same-repo PR could
      # still remove this step, which is why human review of workflow diffs and
      # branch protection remain the backstop.
      - name: Refuse a PR that edits this workflow
        run: |
          git fetch origin main
          if ! git diff --quiet origin/main -- .github/workflows/claude-code-review.yml; then
            echo "::error file=.github/workflows/claude-code-review.yml::This PR edits the review workflow; it must match main (admin merge required)."
            exit 1
          fi

      # Tiered, so a review costs what the push changed:
      #   full  — the PR opened, reopened or left draft (or nothing earlier was reviewed);
      #   delta — a later push: review only the PR's new commits since the last reviewed head;
      #   skip  — the push left the PR's own diff unchanged (it only merged main in) and main
      #           touched none of the PR's files. CI still tests it; there is nothing new to read.
      # To force a full re-review, mark the PR as draft, then ready for review.
      - name: Pick review scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode="full"; last=""; commits=""; overlap=""
          if [ "$ACTION" = synchronize ]; then
            # The newest earlier head this workflow finished on for this branch (a review or a skip).
            last=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/claude-code-review.yml/runs" \
              -f event=pull_request -f branch="$HEAD_REF" -f status=success -F per_page=50 \
              --jq "[.workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")][0].head_sha // empty")
            # A force-push can drop it from history; then nothing is known to be reviewed.
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$last" "$HEAD_SHA"; then
              mode="delta"
            fi
          fi
          if [ "$mode" = delta ]; then
            base_before=$(git merge-base origin/main "$last")
            base_after=$(git merge-base origin/main "$HEAD_SHA")
            # The PR's own new commits, leaving out what came in from main.
            commits=$(git log --no-merges --format=%H "$last..$HEAD_SHA" ^origin/main | tr '\n' ' ')
            # Files main changed since the last review that this PR also changes.
            overlap=$(comm -12 \
              <(git diff --name-only "$base_before" "$base_after" | sort -u) \
              <(git diff --name-only "$base_after" "$HEAD_SHA" | sort -u) | tr '\n' ' ')
            before=$(git diff "$base_before" "$last" | sha256sum)
            after=$(git diff "$base_after" "$HEAD_SHA" | sha256sum)
            if [ "$before" = "$after" ] && [ -z "${overlap// }" ]; then
              mode="skip"
            fi
          fi
          {
            echo "mode=$mode"
            echo "last=$last"
            echo "commits=$commits"
            echo "overlap=$overlap"
          } >> "$GITHUB_OUTPUT"
          echo "Review scope: $mode${last:+ (last reviewed $last)}"
          echo "New PR commits: ${commits:-none}"
          echo "Main changed these PR files: ${overlap:-none}"

      - name: Skip — nothing new to review
        if: steps.scope.outputs.mode == 'skip'
        env:
          LAST: ${{ steps.scope.outputs.last }}
        run: |
          echo "::notice::No review: this push leaves the PR's own diff unchanged since $LAST (it only merged main in), and main touched none of the PR's files."
          echo "No Claude review needed: the PR's diff is unchanged since \`$LAST\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Record review start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Spend the most thinking where a miss costs the most. `max` for a release (it ships
      # everything since the last tag to npm) and for any change to the gate's source (the
      # security surface); `high` for everything else, which keeps routine PRs from eating
      # the subscription's usage limits. Explicit either way, so the level is never a
      # silent default.
      # A delta review is judged by what it reads: the new commits and the overlapping files.
      - name: Pick review effort
        id: effort
        if: steps.scope.outputs.mode != 'skip'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.scope.outputs.mode }}
          COMMITS: ${{ steps.scope.outputs.commits }}
          OVERLAP: ${{ steps.scope.outputs.overlap }}
        run: |
          if [ "$MODE" = delta ]; then
            # shellcheck disable=SC2086 # COMMITS is a space-separated list of SHAs
            files=$( { for c in $COMMITS; do git show --name-only --format= "$c"; done; tr ' ' '\n' <<< "$OVERLAP"; } )
          else
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          fi
          effort=high
          if [[ "$HEAD_REF" == release/* ]] || grep -q '^packages/credentagent-gate/src/' <<< "$files"; then
            effort=max
          fi
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "Review effort: $effort"

      # The review is a self-contained prompt, NOT the code-review plugin: the plugin
      # works by launching sub-agents and reading files, but every tool it needs must
      # also be in --allowedTools, and it was given only `gh` commands. It could not
      # take its first step, stopped after ~3 seconds and posted nothing, while the
      # job still went green. Every tool this prompt uses is listed below.
      - name: Run Claude Code Review
        id: claude-review
        if: steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@v1
        env:
          # Sub-agents must block until they return. By default they run as background
          # tasks; on PR #309 the reviewer launched three, ended its turn to wait for them,
          # and the headless run stopped there, posting nothing.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # Always the Claude subscription login — the CLAUDE_AUTH variable does NOT apply here.
          # On 2026-10-13 it sent this action to our API key and every review failed in under a
          # second with "Credit balance is too low": that key's only funding is the Max plan's
          # included API credit, which the API refuses for requests from this action (the same key
          # worked for the Agent SDK and `claude -p`). CLAUDE.md, "Code review".
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Print the conversation, so a denied tool is named in the log. Without it, the
          # first Opus run on PR #309 failed with "permission_denials_count: 11" and no
          # way to tell which calls were refused. The review only reads public code.
          show_full_output: true
          # Opus, not the action's default model. On PR #309 the default (Sonnet) ran 4 turns
          # in 16 s for $0.10 and approved a release, while a local Opus review found issues.
          # A review is cheap next to a missed bug, so it gets the strongest model and room
          # to read. git is read-only here (log/diff/show/tag/merge-base): the job never runs
          # PR code, because it holds the review token.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --effort ${{ steps.effort.outputs.effort }}
            --allowedTools "Task,Agent,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git tag:*),Bash(git merge-base:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            The PR branch is checked out in the working directory with full git history.

            Review scope for this run: **${{ steps.scope.outputs.mode }}**.
            - full: review the whole PR, following every step below.
            - delta: an earlier Claude review covered this PR up to
              `${{ steps.scope.outputs.last }}`. Review ONLY the PR's new commits:
              `${{ steps.scope.outputs.commits }}` (read each with `git show <sha>`). If any
              files are listed here, main changed them too since that review; check that
              main's changes don't break this PR there: `${{ steps.scope.outputs.overlap }}`.
              Commits merged in from main are not this PR's change; don't review them.
              Read other code only to confirm or rule out a finding in that scope, or to check
              whether an earlier review's findings were fixed. In step 4 below, launch a
              sub-agent only for a dimension the new commits can affect; one is often enough.

            Your stance is a skeptical senior reviewer whose job is to FIND problems, not
            to confirm the PR is fine. An approval must be earned by evidence, not assumed
            because the diff looks small.

            1. Read REVIEW.md at the repo root and the files it points to
               (CLAUDE.md, SECURITY-INVARIANTS.md, docs/reference/architecture-principles.md).
               REVIEW.md is the checklist; follow its output contract, including §6 (scope)
               and §7 (rigor).
            2. Read the PR with `gh pr view ${{ github.event.pull_request.number }} --comments`
               (body AND comments: release notes drafted as comments are in scope) and the
               change with `gh pr diff ${{ github.event.pull_request.number }}`.
            3. Decide the REAL scope (REVIEW.md §6). A release / version-bump PR ships every
               change since the previous tag: review `git diff <previous tag>..HEAD` (find it
               with `git tag --sort=-v:refname`), not only the bump. A PR that changes a
               public API, a README, or a dependency range also puts its callers, examples
               and docs in scope; grep for them.
            4. Read every changed file IN FULL, plus the callers/callees each finding depends
               on. Fan out with sub-agents (Task), at minimum one per dimension: security
               invariants + bypass tests; correctness/edge cases; DX rubric + README/docs
               truthfulness; honesty fencing (trust_level) + PR/release text. Each sub-agent
               reports file:line evidence.
            5. Verify every candidate finding against the code before posting. Report it as
               CONFIRMED (you traced it) or PLAUSIBLE (strong evidence, one step unproven;
               say which step). Drop only what you could disprove. Style nits stay out.
            6. A violated security invariant, a missing bypass test for a changed control,
               a DX-rubric regression, an overclaim of trust_level, or a README/release claim
               the code does not back is request-changes.

            Shell rules (refused calls are wasted turns): run ONE plain command per Bash
            call. Pipes, `&&`, `;`, `$(...)` and heredocs are refused unless every part is
            on the allowed list, so prefer the Read/Grep/Glob tools for files and run
            `git`/`gh` commands bare from the working directory (never `git -C <path>`: it
            does not match the allowed `git diff`/`git log`/... rules). Pass these shell rules
            on to every sub-agent you launch. Post the summary with a single
            `gh pr comment <n> --body "<markdown>"` call: a plain double-quoted string,
            no `$(cat ...)`, no heredoc, no `--body-file -`.

            This is a single headless run: nobody will resume you. Wait for every sub-agent's
            result, then post; never end your turn before the summary comment is posted.

            Posting (REQUIRED — the job fails if you post nothing):
            - For each finding, post an inline comment on the exact line with
              mcp__github_inline_comment__create_inline_comment. Lead it with one plain
              sentence a non-specialist understands; put the evidence after it.
            - Then ALWAYS post exactly one summary comment with
              `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
              Write the VISIBLE part for a busy person who did not write the code and
              is not a security specialist (REVIEW.md "Output contract"). Shape:

                ## Claude review
                **Verdict: ✅ Ready to merge** | **💬 Ready — small notes** | **⛔ Needs changes**

                One or two sentences: what this PR does, and whether it is safe to merge.

                **Fix before merging**   (only if Needs changes; at most 3 items)
                1. What is wrong, in one plain sentence. Why it matters, in one
                   sentence with an everyday example. What to do, in one sentence.

                **Worth a look** (optional, not blocking; at most 5 one-line bullets)

                <details><summary>Details for the author</summary>
                Each finding: `file:line`, the invariant / principle it maps to,
                CONFIRMED or PLAUSIBLE, and the evidence. Then the "Coverage" line:
                scope (e.g. `v0.5.0..HEAD`), files read in full, dimensions checked,
                effort (`${{ steps.effort.outputs.effort }}`).
                </details>

              Rules for everything ABOVE <details>:
              - At most ~200 words. Short sentences. Everyday words.
              - No file paths, line numbers, invariant numbers, rubric codes, or bare
                issue numbers — say what the thing is ("the payment page", "the
                checkout-key setting"). Define any unavoidable term in passing.
              - Do not repeat what passed or what you checked; that goes in Details.
              - A follow-up review opens with one line: "Since the last review: N fixed,
                M still open" — never re-list earlier findings in full.
            - In Details, state the scope: `full`, or `delta` with the commits you reviewed.

      # No fake green: a run that ends without posting a review fails, so a broken
      # review is visible on the PR instead of silently passing.
      - name: Verify Claude posted a review
        if: steps.scope.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.at }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues/$PR/comments?since=$SINCE&per_page=100" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"## Claude review\")))] | length" \
            | awk '{s+=$1} END {print s+0}')
          if [ "$n" -eq 0 ]; then
            echo "::error::Claude finished without posting a '## Claude review' comment on PR #$PR."
            exit 1
          fi
          echo "Claude posted $n review summary comment(s)."
