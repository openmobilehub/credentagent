name: issue-agent-review
# In the Actions list: which agent branch (it carries the issue number), or which PR when run by hand.
run-name: "issue-agent-review · ${{ github.event_name == 'push' && 'main moved: checking agent PRs for conflicts' || github.event.workflow_run.head_branch || format('PR #{0} (run by hand)', inputs.pr) }}"

# The review loop: after every Claude review of a PR in the loop (labelled agent:in-review — an issue
# agent's PR, or any maintainer's PR given the label, e.g. by a coding agent), the agent fixes what
# the review asks, pushes, replies to and resolves each thread — and the push starts the next review.
# It hands the PR to a human only when the review is ✅ Ready to merge, or 💬 with every thread
# resolved, or when it stops (cycle cap, budget, a change it may not publish), saying why.
# How it works and what it trusts: ci/issue-agent/README.md, "The review loop".
#
# Same three-job split as issue-agent.yml, so code an agent writes never shares a job with a token:
#   assess  trusted code: reads the review (bot + write-access people only); hands over when done
#   fix     the agents and the gates; NO GitHub token
#   push    trusted code: applies the checked fix, pushes (no force), answers and resolves threads
#
# Requires the AGENT_GH_TOKEN secret: a push made with GITHUB_TOKEN starts no workflow, so the fix
# would never be reviewed again. Without it the loop hands the PR to a human after the first review.
#
# Also on every push to main (`sweep`): a PR in the loop that now conflicts with main gets no review
# at all (GitHub runs no pull_request workflow on a conflicting PR), so the sweep starts a conflict
# cycle for it — the agent merges main and resolves the conflicts, or hands over.

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (labelled agent:in-review)"
        required: true

concurrency:
  # By PR number, whether started by a review or by hand, so the two can't run on one PR at once.
  group: ${{ github.event_name == 'push' && 'issue-agent-review-sweep' || format('issue-agent-review-pr-{0}', github.event.workflow_run.pull_requests[0].number || inputs.pr) }}
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    # main moved: start a conflict cycle (workflow_dispatch) for each PR in the loop that now conflicts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # GitHub can take a while to settle each PR's mergeability
    permissions:
      contents: read
      pull-requests: read
      issues: write # the issue's status comment
      actions: write # to start the conflict cycles
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check agent PRs against the new main
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_AGENT_DISPATCH_TOKEN: ${{ github.token }}
        run: node ci/issue-agent/run.mjs sweep-conflicts

  assess:
    # Only reviews of PRs from branches in this repository. Which of those are in the loop is decided by
    # run.mjs from main (loopRefusal: agent:in-review, and a write-access author unless it's an issue
    # agent's branch); the rest skip in seconds. Any conclusion but "cancelled" (a newer push superseded
    # it): a failed or verdict-less review is handed to a human rather than left waiting.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # labels, reviewer request, the hand-over comment
      issues: write
    outputs:
      decision: ${{ steps.assess.outputs.decision }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # trusted code from main, even when started by hand from another branch
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Which PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$INPUT_PR" ]; then n="$INPUT_PR"; else
            n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          case "$n" in ''|*[!0-9]*) echo "::notice::No open PR for this review."; n="" ;; esac
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: Read the review
        id: assess
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          ISSUE_AGENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ISSUE_AGENT_REVIEW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # The cycle cap: the repo variable if set (e.g. raise it, then run by hand), else 3.
          ISSUE_AGENT_MAX_REVIEW_CYCLES: ${{ vars.ISSUE_AGENT_MAX_REVIEW_CYCLES }}
          # Off without a token whose pushes start workflows: then no fix session is spent at all.
          ISSUE_AGENT_REVIEW_LOOP: ${{ secrets.AGENT_GH_TOKEN != '' && 'on' || '' }}
        run: node ci/issue-agent/run.mjs assess-review "$PR" --out review.json
      - if: steps.pr.outputs.number != ''
        uses: actions/upload-artifact@v4
        with:
          name: issue-agent-review
          path: review.json
          retention-days: 30

  fix:
    needs: assess
    # fix: answer a review or resolve a conflict; verify: check the issue's criteria before hand-over
    if: needs.assess.outputs.decision == 'fix' || needs.assess.outputs.decision == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # the harness itself comes from main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the harness
        working-directory: ci/issue-agent
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: issue-agent-review
      - name: Answer the review
        env:
          CLAUDE_AUTH: ${{ vars.CLAUDE_AUTH }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Export only the chosen Claude credential. No GitHub token exists in this job.
          if [ "$CLAUDE_AUTH" = "api" ]; then
            [ -n "$API_KEY" ] || { echo "::error::CLAUDE_AUTH is \"api\" but ANTHROPIC_API_KEY is not set."; exit 1; }
            export ANTHROPIC_API_KEY="$API_KEY"
          else
            [ -n "$OAUTH_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set."; exit 1; }
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          fi
          unset API_KEY OAUTH_TOKEN
          node ci/issue-agent/run.mjs fix-review review.json --dir "$RUNNER_TEMP/issue-agent/fix"
      - name: Hand the fix to push (and keep it)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-agent-fix
          path: |
            ${{ runner.temp }}/issue-agent/fix/
            !${{ runner.temp }}/issue-agent/fix/repo/
          include-hidden-files: true # a resolved dotfile (resolved/.eslintrc…) must reach the push job
          retention-days: 30

  push:
    needs: [assess, fix]
    if: always() && (needs.assess.outputs.decision == 'fix' || needs.assess.outputs.decision == 'verify')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # to start a conflict cycle when main moved under the fix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # trusted code from main holds the PAT
          fetch-depth: 0
          persist-credentials: false # pushes go through `gh auth git-credential`
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: issue-agent-review
      - uses: actions/download-artifact@v4
        continue-on-error: true # a fix job that died before uploading still gets a hand-over
        with:
          name: issue-agent-fix
          path: ${{ runner.temp }}/issue-agent/fix
      - name: Git identity (commits are DCO signed off)
        run: |
          git config --global user.name "credentagent-issue-agent[bot]"
          git config --global user.email "issue-agent@users.noreply.github.com"
      - name: Push the fix and answer the review
        env:
          # The PAT's push starts the next review; without it the loop hands over to a human.
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          ISSUE_AGENT_REVIEW_LOOP: ${{ secrets.AGENT_GH_TOKEN != '' && 'on' || '' }}
          ISSUE_AGENT_DISPATCH_TOKEN: ${{ github.token }} # starting a run by hand works with it
          PR: ${{ needs.assess.outputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue-agent/fix"
          node ci/issue-agent/run.mjs push-review "$RUNNER_TEMP/issue-agent/fix" --review review.json --pr "$PR"
