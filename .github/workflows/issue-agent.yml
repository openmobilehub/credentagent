name: issue-agent
# In the Actions list: which issue, and what started it (a run for another label shows that label and is skipped).
run-name: "issue-agent #${{ github.event.issue.number || inputs.issue }} · ${{ github.event_name == 'workflow_dispatch' && 'run by hand' || format('labelled {0} · {1}', github.event.label.name, github.event.issue.title) }}"

# Label an issue `agent` → agents implement it and a draft PR comes back with the evidence.
# How it works and what it trusts: ci/issue-agent/README.md. The three jobs (snapshot, implement,
# publish) live in issue-agent-run.yml, which other repos call too (README, "Using it in another repo").
#
# Auth: the repo variable CLAUDE_AUTH, as for agent-e2e. Unset → the subscription login
# (CLAUDE_CODE_OAUTH_TOKEN); "api" → ANTHROPIC_API_KEY. An AGENT_GH_TOKEN secret lets the PR start CI,
# the Claude review and the review loop (issue-agent-review.yml) on its own.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
      force:
        description: "Skip the preflight (labels / existing PRs)"
        type: boolean
        default: false

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent'
    # This commit's copy: a change to the jobs is tested by this repo's own runs before others pick it up.
    uses: ./.github/workflows/issue-agent-run.yml
    # The most any job gets; each narrows it (the agents' job: contents read, no token).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      issue: ${{ format('{0}', github.event.issue.number || inputs.issue) }}
      sender: ${{ github.event.sender.login || github.actor }}
      snapshot_at: ${{ github.event.issue.updated_at }}
      force: ${{ inputs.force == true }}
      claude_auth: ${{ vars.CLAUDE_AUTH }}
      max_review_cycles: ${{ vars.ISSUE_AGENT_MAX_REVIEW_CYCLES }}
      harness_repo: ${{ github.repository }}
      harness_ref: ${{ github.event.repository.default_branch }}
    secrets: inherit
