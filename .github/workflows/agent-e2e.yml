name: agent-e2e

# Nightly agent-in-the-loop E2E: REAL agents drive the deployed MCP storefront (browse → cart →
# checkout) and the harness asserts on the tool trace — that an agent could use our tools unaided,
# that the age gate + honesty labels reached the agent-facing wire, and that nothing claimed a gated
# order completed. Catches the failure class the deterministic smokes can't: "an agent can no longer
# figure out our tools."
#
# Runs on the Claude Agent SDK. Which account pays is the repo variable CLAUDE_AUTH (CLAUDE.md,
# "Code review"); it applies to this workflow only — the PR review and @claude always use the
# subscription login:
#   unset  — the CLAUDE_CODE_OAUTH_TOKEN secret (the Claude subscription login). With no token the step
#            SKIPS (green, with a notice).
#   "api"  — the ANTHROPIC_API_KEY secret. With no key the step FAILS: asking for the API and not
#            having a key is a misconfiguration, not a reason to go quietly green.

on:
  schedule:
    - cron: "17 13 * * *" # nightly, 13:17 UTC (~6:17 PT)
  workflow_dispatch: {}

jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci/agent-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install harness deps
        run: npm install --no-audit --no-fund

      - name: Claude agent E2E
        env:
          CLAUDE_AUTH: ${{ vars.CLAUDE_AUTH }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Export only the chosen credential, so the SDK can never pick the other one.
          if [ "$CLAUDE_AUTH" = "api" ]; then
            if [ -z "$API_KEY" ]; then
              echo "::error::CLAUDE_AUTH is \"api\" but the ANTHROPIC_API_KEY secret is not set."
              exit 1
            fi
            export ANTHROPIC_API_KEY="$API_KEY"
            echo "::notice::Signing in with the API key (CLAUDE_AUTH=api)."
          else
            if [ -z "$OAUTH_TOKEN" ]; then
              echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not configured — skipping the Claude agent run."
              exit 0
            fi
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
            echo "::notice::Signing in with the Claude subscription login (CLAUDE_AUTH is not \"api\")."
          fi
          node agent-e2e.mjs
